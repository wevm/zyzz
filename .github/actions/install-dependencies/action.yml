name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

inputs:
  rust:
    default: 'false'
    description: 'Restore the Cargo build cache for jobs that compile the Rust crates'

runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # rustup installs the toolchain and targets pinned in rust-toolchain.toml on first use.
    - if: ${{ inputs.rust == 'true' }}
      name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
