version: 2
updates:
  - cooldown:
      default-days: 7
    directories:
      - /
      - /.github/actions/*
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 1
    package-ecosystem: github-actions
    schedule:
      day: monday
      interval: weekly
  - allow:
      - dependency-name: '@types/css-tree'
      - dependency-name: css-tree
      - dependency-name: mdn-data
    cooldown:
      default-days: 7
    directory: /
    groups:
      css-conformance:
        patterns:
          - '@types/css-tree'
          - css-tree
          - mdn-data
    open-pull-requests-limit: 1
    package-ecosystem: npm
    schedule:
      interval: weekly
