name: Benchmarks
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Record benchmark environment
        run: |
          mkdir -p bench/results
          git rev-parse HEAD > bench/results/commit.txt
          sha256sum pnpm-lock.yaml > bench/results/lockfile.txt
          lscpu > bench/results/cpu.txt
          free -b > bench/results/memory.txt
          node --version > bench/results/node.txt
          pnpm --version > bench/results/pnpm.txt
          uname -a > bench/results/platform.txt
      - name: Run benchmarks
        run: pnpm exec vp test bench --run --outputJson bench/results/timings.json
      - name: Summarize bundle sizes
        run: |
          printf '| Workload | Library | CSS bytes | CSS gzip | CSS Brotli | JS gzip | Total gzip |\n| --- | --- | ---: | ---: | ---: | ---: | ---: |\n' >> "$GITHUB_STEP_SUMMARY"
          for report in bench/results/{small,repeated,unique}/*.json; do
            workload=$(basename "$(dirname "$report")")
            jq -r --arg workload "$workload" '[ $workload, .library, .css.raw, .css.gzip, .css.brotli, .javascript.gzip, .total.gzip ] | "| " + (map(tostring) | join(" | ")) + " |"' "$report" >> "$GITHUB_STEP_SUMMARY"
          done
          printf '\nTypestyle compilation and CSS size are unavailable until its CSS emitter is implemented. Timings use warm host processes and fresh compiler state; pipeline scopes are documented in bench/README.md.\n' >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: benchmarks
          path: bench/results/
          retention-days: 30
    timeout-minutes: 5
permissions:
  contents: read
