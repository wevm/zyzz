name: Benchmarks
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
jobs:
  benchmarks:
    name: Benchmarks
    env:
      BENCH_SIZE_THRESHOLD: '5'
      BENCH_TIME_THRESHOLD: '10'
    permissions:
      actions: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Find main benchmark baseline
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/benchmarks.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$run_id" ]; then
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "benchmarks" and .expired == false) | .id')
            if [ -n "$artifact_id" ]; then
              echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Download main benchmark baseline
        if: steps.baseline.outputs.run-id != ''
        id: download-baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          name: benchmarks
          path: ${{ runner.temp }}/benchmark-baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
      - name: Record benchmark environment
        run: |
          mkdir -p bench/results
          git rev-parse HEAD > bench/results/commit.txt
          sha256sum pnpm-lock.yaml > bench/results/lockfile.txt
          lscpu > bench/results/cpu.txt
          free -b > bench/results/memory.txt
          node --version > bench/results/node.txt
          pnpm --version > bench/results/pnpm.txt
          uname -a > bench/results/platform.txt
      - name: Run benchmarks
        run: pnpm exec vp test bench --run --no-file-parallelism --outputJson bench/results/timings.json
      - name: Summarize benchmarks
        run: |
          printf '## Benchmarks\n\n[Workflow run](%s/%s/actions/runs/%s)\n\nZyzz uses its in-memory literal compiler with independent composition for these separate component applications; source extraction and runtime composition are excluded. Ordered class combinations are tested separately.\n\n## Compiler Comparisons\n\nSizes are bytes. Total gzip includes CSS + required client JavaScript. Literal comparisons use shared Lightning CSS final processing (Chrome 120, Firefox 128, Safari 17); upstream compiler processing differs.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > bench/results/report.md
          for workload in small repeated unique partial palette independent sparse components; do
            case "$workload" in
              small) title='3 Components' ;;
              repeated) title='1,000 Components — Repeated Styles' ;;
              unique) title='1,000 Components — Unique Padding' ;;
              partial) title='100 Components — Partial Sharing' ;;
              palette) title='100 Components — Reused Palette' ;;
              independent) title='100 Components — Independent Values' ;;
              sparse) title='100 Components — Sparse Properties' ;;
              components) title='60 Components — Mixed Shapes' ;;
            esac
            printf '\n### %s\n\n| Library | Build (ms) | CSS gzip | Total gzip |\n| --- | ---: | ---: | ---: |\n' "$title" >> bench/results/report.md
            jq -rs --arg workload "$workload" --slurpfile timings bench/results/timings.json '
              sort_by(.library)[] as $size |
              $timings[0].files[].groups[] | select(.fullName | endswith(" / " + $workload)) |
              .benchmarks[] | select(.name == $size.library) |
              [({"panda":"Panda CSS","stylex":"StyleX","tailwind":"Tailwind","vanilla-extract":"vanilla-extract","zyzz":"Zyzz"}[.name]),
               ((.mean * 1000 | round) / 1000), $size.css.gzip, $size.total.gzip] |
              "| " + (map(tostring) | join(" | ")) + " |"
            ' bench/results/"$workload"/*.json >> bench/results/report.md
            printf '\n<details>\n<summary>Full Measurements</summary>\n\n| Library | Error (±%%) | Samples | CSS raw | CSS Brotli | JS gzip |\n| --- | ---: | ---: | ---: | ---: | ---: |\n' >> bench/results/report.md
            jq -rs --arg workload "$workload" --slurpfile timings bench/results/timings.json '
              sort_by(.library)[] as $size |
              $timings[0].files[].groups[] | select(.fullName | endswith(" / " + $workload)) |
              .benchmarks[] | select(.name == $size.library) |
              [({"panda":"Panda CSS","stylex":"StyleX","tailwind":"Tailwind","vanilla-extract":"vanilla-extract","zyzz":"Zyzz"}[.name]),
               ((.rme * 100 | round) / 100), .sampleCount, $size.css.raw, $size.css.brotli, $size.javascript.gzip] |
              "| " + (map(tostring) | join(" | ")) + " |"
            ' bench/results/"$workload"/*.json >> bench/results/report.md
            printf '\n</details>\n' >> bench/results/report.md
          done
          printf '\n## Theme Comparisons\n\nTwo compatible scopes, light/dark values, and independent components. Theme CSS uses shared final minification targeting native light-dark support (Chrome 123, Firefox 128, Safari 17.5). Total delivery includes CSS and actual component/scope JavaScript exports. zyzz starts from validated references; zyzz-tokens includes shorthand validation and resolution before the same emission and bundling. Neither Zyzz lane includes source parsing. Other compiler boundaries are documented in bench/README.md.\n' >> bench/results/report.md
          for count in 10 100; do
            printf '\n### %s Components\n\n| Library | Build (ms) | CSS gzip | JS gzip | Total gzip |\n| --- | ---: | ---: | ---: | ---: |\n' "$count" >> bench/results/report.md
            jq -rs --arg count "$count" --slurpfile timings bench/results/timings.json '
              sort_by(.library)[] as $size |
              $timings[0].files[].groups[] | select(.fullName | endswith("theme comparison / " + $count + " styles")) |
              .benchmarks[] | select(.name == $size.library) |
              [.name, ((.mean * 1000 | round) / 1000), $size.css.gzip, $size.javascript.gzip, $size.total.gzip] |
              "| " + (map(tostring) | join(" | ")) + " |"
            ' bench/results/theme-comparison/"$count"/*.json >> bench/results/report.md
            printf '\n<details>\n<summary>Full Measurements</summary>\n\n| Library | Error (±%%) | Samples | CSS raw | CSS Brotli | JS raw | JS Brotli | Total raw | Total Brotli |\n| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n' >> bench/results/report.md
            jq -rs --arg count "$count" --slurpfile timings bench/results/timings.json '
              sort_by(.library)[] as $size |
              $timings[0].files[].groups[] | select(.fullName | endswith("theme comparison / " + $count + " styles")) |
              .benchmarks[] | select(.name == $size.library) |
              [.name, ((.rme * 100 | round) / 100), .sampleCount, $size.css.raw, $size.css.brotli, $size.javascript.raw, $size.javascript.brotli, $size.total.raw, $size.total.brotli] |
              "| " + (map(tostring) | join(" | ")) + " |"
            ' bench/results/theme-comparison/"$count"/*.json >> bench/results/report.md
            printf '\n</details>\n' >> bench/results/report.md
          done
          printf '\n## Source Extraction\n\nParsing, binding analysis, literal validation, and CSS emission. Excludes rewriting, final minification, and browser bundling.\n\n| Workload | Time (ms) | Error (±%%) | Samples |\n| --- | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r '
            .files[].groups[] | select(.fullName | contains("source extraction / ")) |
            . as $group | .benchmarks[] |
            [($group.fullName | split(" / ") | last), ((.mean * 1000 | round) / 1000), ((.rme * 100 | round) / 100), .sampleCount] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/timings.json >> bench/results/report.md
          printf '\n## Module Transforms\n\nOrdered source compilation, rewriting, and maps. Final minification and browser bundling are outside timing; sizes include the bundled callable runtime. Local themes include literal token extraction, resolution, and two scalar scopes.\n' >> bench/results/report.md
          for kind in literal theme alias tokens; do
            case "$kind" in
              literal) title='Literal Styles'; group='module transform' ;;
              theme) title='Local Theme Styles'; group='theme source transform' ;;
              alias) title='Theme Aliases'; group='theme alias transform' ;;
              tokens) title='Explicit Theme Tokens'; group='theme token transform' ;;
            esac
            printf '\n### %s\n\n| Styles | Time (ms) | CSS gzip | JS gzip | Total gzip |\n| --- | ---: | ---: | ---: | ---: |\n' "$title" >> bench/results/report.md
            jq -rs --arg kind "$kind" --arg group "$group" --slurpfile timings bench/results/timings.json '
              sort_by(.count)[] | select(.kind == $kind) | . as $size |
              $timings[0].files[].groups[] | select(.fullName | endswith($group + " / " + ($size.count | tostring) + " styles")) |
              .benchmarks[] |
              [$size.count, ((.mean * 1000 | round) / 1000), $size.css.gzip, $size.javascript.gzip, $size.total.gzip] |
              "| " + (map(tostring) | join(" | ")) + " |"
            ' bench/results/transform/*.json >> bench/results/report.md
          done
          printf '\n## Static Props Binding\n\n| Application | Time (ns) | Error (±%%) | Samples |\n| --- | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r '
            .files[].groups[] | select(.fullName | contains("static props binding")) | .benchmarks[] |
            [.name, (.mean * 1000000 | round), ((.rme * 100 | round) / 100), .sampleCount] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/timings.json >> bench/results/report.md
          printf '\n## File Host — 100 Styles\n\nCold process includes startup; watch edits include the source write through artifact publication.\n\n| Operation | Time (ms) | Error (±%%) | Samples |\n| --- | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r '
            .files[].groups[] | select(.fullName | contains("file host / ")) | .benchmarks[] |
            [.name, ((.mean * 1000 | round) / 1000), ((.rme * 100 | round) / 100), .sampleCount] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/timings.json >> bench/results/report.md
          printf '\n## Theme Compilation\n\nIn-memory emission with two scopes and light/dark pairs; no source rewriting or client bundling. Sizes are emitted CSS before final minification.\n\n| Styles | Time (ms) | CSS raw | CSS gzip | CSS Brotli |\n| --- | ---: | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r --slurpfile timings bench/results/timings.json '
            . as $size |
            $timings[0].files[].groups[] | select(.fullName | endswith("theme compilation / " + ($size.count | tostring) + " styles")) |
            .benchmarks[] |
            [$size.count, ((.mean * 1000 | round) / 1000), $size.raw, $size.gzip, $size.brotli] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/themes/*.json >> bench/results/report.md
          printf '\nBuild timings use warm host processes and fresh compiler state. Compiler workflows have different scopes; see bench/README.md in the repository for measurement boundaries.\n' >> bench/results/report.md
      - name: Compare with main
        env:
          BASELINE_DIRECTORY: ${{ steps.download-baseline.outcome == 'success' && format('{0}/benchmark-baseline', runner.temp) || '' }}
        run: |
          node bench/Compare.ts bench/results "$BASELINE_DIRECTORY" > "$RUNNER_TEMP/benchmark-comparison.md"
          cat "$RUNNER_TEMP/benchmark-comparison.md" bench/results/report.md > "$RUNNER_TEMP/benchmark-report.md"
          mv "$RUNNER_TEMP/benchmark-report.md" bench/results/report.md
          cat bench/results/report.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        name: Comment benchmark results
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmarks
          path: bench/results/report.md
      - if: ${{ !cancelled() }}
        name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: benchmarks
          path: bench/results/
          retention-days: 30
      - name: Check benchmark thresholds
        env:
          BASELINE_DIRECTORY: ${{ steps.download-baseline.outcome == 'success' && format('{0}/benchmark-baseline', runner.temp) || '' }}
        run: node bench/Compare.ts bench/results "$BASELINE_DIRECTORY" --check > /dev/null
    timeout-minutes: 15
permissions:
  contents: read
