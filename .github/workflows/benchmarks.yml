name: Benchmarks
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
jobs:
  benchmarks:
    name: Benchmarks
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Record benchmark environment
        run: |
          mkdir -p bench/results
          git rev-parse HEAD > bench/results/commit.txt
          sha256sum pnpm-lock.yaml > bench/results/lockfile.txt
          lscpu > bench/results/cpu.txt
          free -b > bench/results/memory.txt
          node --version > bench/results/node.txt
          pnpm --version > bench/results/pnpm.txt
          uname -a > bench/results/platform.txt
      - name: Run benchmarks
        run: pnpm exec vp test bench --run --outputJson bench/results/timings.json
      - name: Summarize benchmarks
        run: |
          printf '## Benchmarks\n\n[Workflow run](%s/%s/actions/runs/%s) · Commit %s\n\n### Compilation and Authoring\n\n| Workload | Benchmark | Mean (ms) | Error (±%%) | Samples |\n| --- | --- | ---: | ---: | ---: |\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > bench/results/report.md
          jq -r '.files[].groups[] as $group | $group.benchmarks[] | select(.mean != null) | [($group.fullName | split(" > ")[1:] | join(" / ")), .name, ((.mean * 1000 | round) / 1000), ((.rme * 100 | round) / 100), .sampleCount] | "| " + (map(tostring) | join(" | ")) + " |"' bench/results/timings.json >> bench/results/report.md
          printf '\n### Bundled Size\n\n' >> bench/results/report.md
          printf '| Workload | Library | CSS bytes | CSS gzip | CSS Brotli | JS gzip | Total gzip |\n| --- | --- | ---: | ---: | ---: | ---: | ---: |\n' >> bench/results/report.md
          for report in bench/results/{small,repeated,unique}/*.json; do
            workload=$(basename "$(dirname "$report")")
            jq -r --arg workload "$workload" '[ $workload, .library, .css.raw, .css.gzip, .css.brotli, .javascript.gzip, .total.gzip ] | "| " + (map(tostring) | join(" | ")) + " |"' "$report" >> bench/results/report.md
          done
          printf '\nTypestyle compilation and CSS size are unavailable until its CSS emitter is implemented. Timings use warm host processes and fresh compiler state; pipeline scopes are documented in bench/README.md.\n' >> bench/results/report.md
          cat bench/results/report.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        name: Comment benchmark results
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmarks
          path: bench/results/report.md
      - if: ${{ !cancelled() }}
        name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: benchmarks
          path: bench/results/
          retention-days: 30
    timeout-minutes: 5
permissions:
  contents: read
