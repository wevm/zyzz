name: Benchmarks
on:
  pull_request:
    types: [closed, opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline:
        description: Optional source revision for same-runner native compiler comparison
        type: string
        default: ''
      native-count:
        description: Native compiler definition counts
        type: choice
        default: all
        options: [all, '1000']
      suite:
        description: Benchmark suite
        type: choice
        default: all
        options: [all, native-compiler, native-ios, native-android]
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.suite || 'all' }}
jobs:
  checks:
    if: github.event.action != 'closed' && (!inputs.suite || inputs.suite == 'all')
    name: Benchmark checks and Next.js comparisons
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Build package
        run: pnpm build
      - name: Check benchmark fixtures and compare Next.js builds
        run: pnpm bench:check
      - name: Upload benchmark checks and Next.js comparisons
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: benchmarks-checks
          path: |
            bench/results/
            test-results/
          retention-days: 30
    timeout-minutes: 30
  compiler:
    if: github.event.action != 'closed' && (!inputs.suite || inputs.suite == 'all')
    name: Compiler benchmarks
    env:
      BENCH_SIZE_THRESHOLD: '105'
      BENCH_TIME_THRESHOLD: '110'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone comparison baseline
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
      - name: Install baseline dependencies
        if: github.event_name != 'push'
        uses: ./.github/actions/install-dependencies
      - name: Benchmark baseline on this runner
        if: github.event_name != 'push'
        id: baseline
        run: |
          if test -f bench/Runtime.bench.ts; then pnpm exec playwright install --with-deps chromium; fi
          mkdir -p bench/results
          git rev-parse HEAD > bench/results/commit.txt
          sha256sum pnpm-lock.yaml > bench/results/lockfile.txt
          lscpu > bench/results/cpu.txt
          free -b > bench/results/memory.txt
          node --version > bench/results/node.txt
          pnpm --version > bench/results/pnpm.txt
          uname -a > bench/results/platform.txt
          pnpm exec vp test bench --run --no-file-parallelism --outputJson bench/results/timings.json
          mv bench/results "$RUNNER_TEMP/benchmark-baseline"
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        id: dependencies
        uses: ./.github/actions/install-dependencies
      - name: Record benchmark environment
        run: |
          mkdir -p bench/results
          git rev-parse HEAD > bench/results/commit.txt
          sha256sum pnpm-lock.yaml > bench/results/lockfile.txt
          lscpu > bench/results/cpu.txt
          free -b > bench/results/memory.txt
          node --version > bench/results/node.txt
          pnpm --version > bench/results/pnpm.txt
          uname -a > bench/results/platform.txt
      - name: Run benchmarks
        run: pnpm exec vp test bench --run --no-file-parallelism --outputJson bench/results/timings.json
      - name: Summarize benchmarks
        run: |
          jq '
            .files |= map(.groups |= map(.benchmarks |= map(select(
              (.mean | type) == "number" and (.rme | type) == "number" and .sampleCount > 0
            ))))
          ' bench/results/timings.json > bench/results/timings-measured.json
          printf '\n## Source Extraction\n\nParsing, binding analysis, literal validation, and CSS emission. Excludes rewriting, final minification, and browser bundling.\n\n| Workload | Time (ms) | Error (±%%) | Samples |\n| --- | ---: | ---: | ---: |\n' > bench/results/report.md
          jq -r '
            .files[].groups[] | select(.fullName | contains("source extraction / ")) |
            . as $group | .benchmarks[] |
            [($group.fullName | split(" / ") | last), ((.mean * 1000 | round) / 1000), ((.rme * 100 | round) / 100), .sampleCount] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/timings-measured.json >> bench/results/report.md
          printf '\n## Module Transforms\n\nOrdered source compilation, rewriting, and maps. Final minification and browser bundling are outside timing. Sizes include the bundled callable runtime. Local themes include literal token extraction, resolution, and two scalar scopes.\n' >> bench/results/report.md
          for kind in literal theme alias tokens; do
            case "$kind" in
              literal) title='Literal Styles'; group='module transform' ;;
              theme) title='Local Theme Styles'; group='theme source transform' ;;
              alias) title='Theme Aliases'; group='theme alias transform' ;;
              tokens) title='Explicit Theme Tokens'; group='theme token transform' ;;
            esac
            printf '\n### %s\n\n| Styles | Time (ms) | CSS gzip | JS gzip | Total gzip |\n| --- | ---: | ---: | ---: | ---: |\n' "$title" >> bench/results/report.md
            jq -rs --arg kind "$kind" --arg group "$group" --slurpfile timings bench/results/timings-measured.json '
              sort_by(.count)[] | select(.kind == $kind) | . as $size |
              $timings[0].files[].groups[] | select(.fullName | endswith($group + " / " + ($size.count | tostring) + " styles")) |
              .benchmarks[] |
              [$size.count, ((.mean * 1000 | round) / 1000), $size.css.gzip, $size.javascript.gzip, $size.total.gzip] |
              "| " + (map(tostring) | join(" | ")) + " |"
            ' bench/results/transform/*.json >> bench/results/report.md
          done
          printf '\n## Static Props Binding\n\n| Application | Time (ns) | Error (±%%) | Samples |\n| --- | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r '
            .files[].groups[] | select(.fullName | contains("static props binding")) | .benchmarks[] |
            [.name, (.mean * 1000000 | round), ((.rme * 100 | round) / 100), .sampleCount] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/timings-measured.json >> bench/results/report.md
          printf '\n## File Host: 100 Styles\n\nCold process includes startup. Watch edits include the source write through artifact publication.\n\n| Operation | Time (ms) | Error (±%%) | Samples |\n| --- | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r '
            .files[].groups[] | select(.fullName | contains("file host / ")) | .benchmarks[] |
            [.name, ((.mean * 1000 | round) / 1000), ((.rme * 100 | round) / 100), .sampleCount] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/timings-measured.json >> bench/results/report.md
          printf '\n## Theme Compilation\n\nIn-memory emission with two scopes and light/dark pairs, without source rewriting or client bundling. Sizes are emitted CSS before final minification.\n\n| Styles | Time (ms) | CSS raw | CSS gzip | CSS Brotli |\n| --- | ---: | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r --slurpfile timings bench/results/timings-measured.json '
            . as $size |
            $timings[0].files[].groups[] | select(.fullName | endswith("theme compilation / " + ($size.count | tostring) + " styles")) |
            .benchmarks[] |
            [$size.count, ((.mean * 1000 | round) / 1000), $size.raw, $size.gzip, $size.brotli] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/themes/*.json >> bench/results/report.md
          printf '\nBuild timings use warm host processes and fresh compiler state. Compiler workflows have different scopes. See bench/README.md in the repository for measurement boundaries.\n' >> bench/results/report.md
      - name: Check framework performance
        id: frameworks
        continue-on-error: true
        run: node bench/Check.ts bench/results > bench/results/frameworks.md
      - name: Prepare benchmark comparisons
        id: comparison
        env:
          BENCH_BASELINE_MODE: same-runner
          BASELINE_DIRECTORY: ${{ steps.baseline.outcome == 'success' && format('{0}/benchmark-baseline', runner.temp) || '' }}
        run: |
          node bench/Compare.ts bench/results "$BASELINE_DIRECTORY" "$RUNNER_TEMP/benchmark-action" > "$RUNNER_TEMP/benchmark-comparison.md"
          printf '# Benchmark Report\n\n[Workflow run](%s/%s/actions/runs/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/benchmark-report.md"
          cat bench/results/frameworks.md >> "$RUNNER_TEMP/benchmark-report.md"
          printf '\n<details>\n<summary>Baseline changes</summary>\n\n' >> "$RUNNER_TEMP/benchmark-report.md"
          cat "$RUNNER_TEMP/benchmark-comparison.md" >> "$RUNNER_TEMP/benchmark-report.md"
          printf '\n</details>\n\n<details>\n<summary>Extraction, transforms, binding, host, and theme timings</summary>\n\n' >> "$RUNNER_TEMP/benchmark-report.md"
          cat bench/results/report.md >> "$RUNNER_TEMP/benchmark-report.md"
          printf '\n</details>\n' >> "$RUNNER_TEMP/benchmark-report.md"
          mv "$RUNNER_TEMP/benchmark-report.md" bench/results/report.md
          cat bench/results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload baseline results
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: benchmarks-baseline
          path: ${{ runner.temp }}/benchmark-baseline/
          retention-days: 30
      - name: Report timing comparisons
        if: ${{ !cancelled() && steps.comparison.outcome == 'success' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          alert-threshold: '${{ env.BENCH_TIME_THRESHOLD }}%'
          external-data-json-path: ${{ runner.temp }}/benchmark-action/time-baseline.json
          fail-on-alert: false
          github-token: ${{ github.token }}
          name: time
          output-file-path: ${{ runner.temp }}/benchmark-action/time.json
          save-data-file: false
          tool: customSmallerIsBetter
      - name: Check size regressions
        if: ${{ !cancelled() && steps.comparison.outcome == 'success' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          alert-threshold: '${{ env.BENCH_SIZE_THRESHOLD }}%'
          external-data-json-path: ${{ runner.temp }}/benchmark-action/size-baseline.json
          fail-on-alert: ${{ github.event_name != 'push' }}
          github-token: ${{ github.token }}
          name: size
          output-file-path: ${{ runner.temp }}/benchmark-action/size.json
          save-data-file: false
          tool: customSmallerIsBetter
      - name: Enforce framework performance
        if: ${{ !cancelled() && steps.frameworks.outcome == 'failure' }}
        run: exit 1
      - if: ${{ !cancelled() }}
        name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: benchmarks
          path: bench/results/
          retention-days: 30
    timeout-minutes: 50
  benchmarks:
    name: Benchmarks
    if: ${{ !cancelled() && github.event.action != 'closed' && (!inputs.suite || inputs.suite == 'all') }}
    needs: [checks, compiler, renders, type-benches]
    runs-on: ubuntu-latest
    steps:
      - name: Require benchmark checks and measurements
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          COMPILER_RESULT: ${{ needs.compiler.result }}
          RENDER_RESULT: ${{ needs.renders.result }}
          TYPE_BENCHES_RESULT: ${{ needs.type-benches.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TYPE_BENCHES_RESULT" = success
          test "$COMPILER_RESULT" = success
          test "$RENDER_RESULT" = success
  renders:
    if: github.event.action != 'closed' && (!inputs.suite || inputs.suite == 'all')
    name: React renders
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        id: dependencies
        uses: ./.github/actions/install-dependencies
      - name: Record render environment
        run: |
          mkdir -p bench/results/render-environment
          git rev-parse HEAD > bench/results/render-environment/commit.txt
          sha256sum pnpm-lock.yaml > bench/results/render-environment/lockfile.txt
          lscpu > bench/results/render-environment/cpu.txt
          free -b > bench/results/render-environment/memory.txt
          node --version > bench/results/render-environment/node.txt
          pnpm --version > bench/results/render-environment/pnpm.txt
          uname -a > bench/results/render-environment/platform.txt
      - name: Remove separate render comment
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          delete: true
          header: render-benchmarks
      - name: Install runtime benchmark browser
        id: render-browser
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Measure base React renders with the candidate harness
        id: render-baseline
        if: ${{ !cancelled() && steps.render-browser.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BENCH_RENDER_OUTPUT: bench/results/render-base
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Keep installed dependencies and the harness fixed; entrypoints follow source.
          trap 'git restore --source=HEAD --worktree -- package.json src' EXIT
          git restore --source="$BASE_SHA" --worktree -- src
          node scripts/benchmark-manifest.ts
          mkdir -p "$BENCH_RENDER_OUTPUT"
          printf '%s\n' "$BASE_SHA" > "$BENCH_RENDER_OUTPUT/commit.txt"
          if grep -q "cssOutput:'grouped'" bench/Runtime.ts && ! grep -q 'cssOutput' src/Config.ts; then
            printf '%s\n' 'No comparable render baseline: the base revision does not support grouped configuration output.' > "$BENCH_RENDER_OUTPUT/unavailable.txt"
            cat "$BENCH_RENDER_OUTPUT/unavailable.txt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -q "export { style }" src/index.ts; then
            printf '%s\n' 'No comparable render baseline: the base revision does not export the style authoring function.' > "$BENCH_RENDER_OUTPUT/unavailable.txt"
            cat "$BENCH_RENDER_OUTPUT/unavailable.txt" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm bench:render
      - name: Measure production React renders in Chromium
        id: render
        if: ${{ !cancelled() && steps.render-browser.outcome == 'success' && (steps.render-baseline.outcome == 'success' || steps.render-baseline.outcome == 'skipped') }}
        run: pnpm bench:render
      - name: Validate and report React renders
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: |
          node bench/RenderReport.ts bench/results > bench/results/render.md
          cat bench/results/render.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload render results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: benchmarks-render
          path: bench/results/
          retention-days: 30
    timeout-minutes: 30
  report:
    name: Benchmark Report
    if: ${{ !cancelled() && github.event.action != 'closed' && (!inputs.suite || inputs.suite == 'all') }}
    needs: [compiler, renders]
    permissions:
      actions: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmarks
          path: reports/benchmarks
      - name: Download render results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmarks-render
          path: reports/benchmarks
      - name: Prepare comment
        run: |
          mkdir -p reports
          node bench/Comment.ts reports/benchmarks/report.md reports/benchmarks/render.md > reports/comment.md
          cat reports/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment benchmark results
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmarks
          path: reports/comment.md
    timeout-minutes: 5
  type-benches:
    if: github.event.action != 'closed' && (!inputs.suite || inputs.suite == 'all')
    name: Type instantiations ${{ matrix.typescript }} (${{ matrix.shard }}/2)
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        typescript: ['6.0']
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install TypeScript ${{ matrix.typescript }}
        run: pnpm add --save-dev "typescript@${{ matrix.typescript }}"
      - name: Check type instantiations
        run: |
          set -o pipefail
          pnpm bench:types --shard ${{ matrix.shard }}/2 | tee type-benches.txt
          cat type-benches.txt >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 30
  native-compiler:
    if: github.event.action != 'closed' && (!inputs.suite || inputs.suite == 'all' || inputs.suite == 'native-compiler')
    name: Native compiler ${{ matrix.platform }} / ${{ matrix.count }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        count: ${{ fromJSON(inputs.native-count == '1000' && '[1000]' || '[10,100,1000]') }}
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-dependencies
      - run: pnpm build
      - run: |
          node bench/native/Build.ts
          node bench/results/native/tools/Prepare.mjs
      - run: pnpm --dir bench/native/app check:types
      - name: Validate native compiler fixtures
        run: pnpm exec vp test run --config bench/native/Check.config.ts
      - name: Profile unique native compilation
        if: matrix.count == 1000
        env:
          NODE_ENV: production
        run: node bench/results/native/tools/Profile.mjs ${{ matrix.platform }}
      - name: Upload native compiler CPU profile
        if: matrix.count == 1000
        uses: actions/upload-artifact@v4
        with:
          name: native-cpu-${{ matrix.platform }}
          path: bench/results/native/*.cpuprofile
          if-no-files-found: error
          retention-days: 30
      - name: Measure native compiler baseline
        if: inputs.baseline != ''
        timeout-minutes: 35
        env:
          BASELINE_REF: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASELINE_REF"
          BASELINE_SHA=$(git rev-parse FETCH_HEAD)
          trap 'git restore --source=HEAD --worktree -- src' EXIT
          git restore --source="$BASELINE_SHA" --worktree -- src
          pnpm build
          mkdir -p bench/results/native/baseline
          printf '%s\n' "$BASELINE_SHA" > bench/results/native/baseline/commit.txt
          pnpm exec vp test bench --config bench/native/Compile.config.ts --run --no-file-parallelism --testNamePattern 'native (cold process )?${{ matrix.platform }} / [^/]+ / ${{ matrix.count }}\b' --outputJson bench/results/native/baseline/compile-timings.json 2>&1 | tee bench/results/native/baseline/compiler.log
      - name: Restore candidate package
        if: inputs.baseline != ''
        run: pnpm build
      - name: Measure native compiler pipelines
        timeout-minutes: 35
        run: |
          mkdir -p bench/results/native
          git rev-parse HEAD > bench/results/native/commit.txt
          sha256sum pnpm-lock.yaml > bench/results/native/lockfile.txt
          lscpu > bench/results/native/cpu.txt
          node --version > bench/results/native/node.txt
          uname -a > bench/results/native/platform.txt
          free -b > bench/results/native/memory.txt
          cp bench/native/app/package.json bench/results/native/dependencies.json
          set -o pipefail
          pnpm exec vp test bench --config bench/native/Compile.config.ts --run --no-file-parallelism --testNamePattern 'native (cold process )?${{ matrix.platform }} / [^/]+ / ${{ matrix.count }}\b' --outputJson bench/results/native/compile-timings.json 2>&1 | tee bench/results/native/compiler.log
      - name: Publish native compiler summary
        run: node bench/results/native/tools/CompileReport.mjs ${{ matrix.platform }} ${{ matrix.count }} >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: benchmarks-native-compiler-${{ matrix.platform }}-${{ matrix.count }}
          path: bench/results/native/
          if-no-files-found: error
          retention-days: 30

  native-ios:
    if: github.event.action != 'closed' && (!inputs.suite || inputs.suite == 'all' || inputs.suite == 'native-ios')
    name: Native iOS renders
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - uses: ./.github/actions/install-dependencies
      - run: pnpm build
      - run: |
          node bench/native/Build.ts
          node bench/results/native/tools/Prepare.mjs
      - name: Generate native project
        working-directory: bench/native/app
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: bench/native/app/ios
        run: pod install
      - run: mkdir -p bench/results
      - name: Build release simulator app
        working-directory: bench/native/app
        run: xcodebuild -workspace ios/ZyzzNativeBench.xcworkspace -scheme ZyzzNativeBench -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO > ../../results/native-ios-build.log 2>&1
      - name: Boot simulator and measure
        run: |
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test "$DEVICE" != null
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" bench/native/app/build/Build/Products/Release-iphonesimulator/ZyzzNativeBench.app
          node bench/results/native/tools/Run.mjs ios "$DEVICE"
      - name: Publish native summary
        if: ${{ !cancelled() }}
        run: |
          if test -f bench/results/native/ios/report.md; then
            cat bench/results/native/ios/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: benchmarks-native-ios
          path: bench/results/
          if-no-files-found: error
          retention-days: 30

  native-android:
    if: github.event.action != 'closed' && (!inputs.suite || inputs.suite == 'all' || inputs.suite == 'native-android')
    name: Native Android renders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reserve space for native build and emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - uses: ./.github/actions/install-dependencies
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            pnpm-lock.yaml
            bench/native/app/package.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: pnpm build
      - run: |
          node bench/native/Build.ts
          node bench/results/native/tools/Prepare.mjs
      - name: Generate native project
        working-directory: bench/native/app
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Build release app
        working-directory: bench/native/app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Release native build toolchain space
        run: |
          test -n "$ANDROID_HOME"
          rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
          df -h /
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          disable-animations: true
          script: |
            adb install bench/native/app/android/app/build/outputs/apk/release/app-release.apk
            node bench/results/native/tools/Run.mjs android emulator-5554
      - name: Publish native summary
        if: ${{ !cancelled() }}
        run: |
          if test -f bench/results/native/android/report.md; then
            cat bench/results/native/android/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: benchmarks-native-android
          path: bench/results/native/
          if-no-files-found: error
          retention-days: 30

permissions:
  contents: read
