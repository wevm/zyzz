name: Benchmarks
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
jobs:
  benchmarks:
    name: Benchmarks
    env:
      BENCH_SIZE_THRESHOLD: '105'
      BENCH_TIME_THRESHOLD: '110'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone comparison baseline
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
      - name: Install baseline dependencies
        if: github.event_name != 'push'
        uses: ./.github/actions/install-dependencies
      - name: Benchmark baseline on this runner
        if: github.event_name != 'push'
        id: baseline
        run: |
          if test -f bench/Runtime.bench.ts; then pnpm exec playwright install --with-deps chromium; fi
          mkdir -p bench/results
          git rev-parse HEAD > bench/results/commit.txt
          sha256sum pnpm-lock.yaml > bench/results/lockfile.txt
          lscpu > bench/results/cpu.txt
          free -b > bench/results/memory.txt
          node --version > bench/results/node.txt
          pnpm --version > bench/results/pnpm.txt
          uname -a > bench/results/platform.txt
          pnpm exec vp test bench --run --no-file-parallelism --outputJson bench/results/timings.json
          mv bench/results "$RUNNER_TEMP/benchmark-baseline"
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Record benchmark environment
        run: |
          mkdir -p bench/results
          git rev-parse HEAD > bench/results/commit.txt
          sha256sum pnpm-lock.yaml > bench/results/lockfile.txt
          lscpu > bench/results/cpu.txt
          free -b > bench/results/memory.txt
          node --version > bench/results/node.txt
          pnpm --version > bench/results/pnpm.txt
          uname -a > bench/results/platform.txt
      - name: Install runtime benchmark browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Measure base runtime with the candidate harness
        if: github.event_name == 'pull_request'
        env:
          BENCH_RUNTIME: '1'
          BENCH_RUNTIME_OUTPUT: bench/results/runtime-base
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE_SHA=$(git rev-parse "origin/$BASE_REF")
          trap 'git restore --source=HEAD --worktree -- src' EXIT
          git restore --source="$BASE_SHA" --worktree -- src
          mkdir -p "$BENCH_RUNTIME_OUTPUT"
          printf '%s\n' "$BASE_SHA" > "$BENCH_RUNTIME_OUTPUT/commit.txt"
          pnpm exec vp test run bench/Runtime.browser.test.ts --no-file-parallelism
      - name: Measure runtime in Chromium
        env:
          BENCH_RUNTIME: '1'
        run: pnpm exec vp test run bench/Runtime.browser.test.ts --no-file-parallelism
      - name: Publish early runtime results
        if: ${{ !cancelled() && hashFiles('bench/results/browser-timings.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-benchmarks
          path: |
            bench/results/browser-timings.json
            bench/results/runtime/
            bench/results/runtime-base/
            bench/results/commit.txt
            bench/results/lockfile.txt
            bench/results/cpu.txt
            bench/results/node.txt
          retention-days: 30
      - name: Run benchmarks
        run: pnpm exec vp test bench --run --no-file-parallelism --outputJson bench/results/timings.json
      - name: Summarize benchmarks
        run: |
          jq '
            .files |= map(.groups |= map(.benchmarks |= map(select(
              (.mean | type) == "number" and (.rme | type) == "number" and .sampleCount > 0
            ))))
          ' bench/results/timings.json > bench/results/timings-measured.json
          printf '\n## Source Extraction\n\nParsing, binding analysis, literal validation, and CSS emission. Excludes rewriting, final minification, and browser bundling.\n\n| Workload | Time (ms) | Error (±%%) | Samples |\n| --- | ---: | ---: | ---: |\n' > bench/results/report.md
          jq -r '
            .files[].groups[] | select(.fullName | contains("source extraction / ")) |
            . as $group | .benchmarks[] |
            [($group.fullName | split(" / ") | last), ((.mean * 1000 | round) / 1000), ((.rme * 100 | round) / 100), .sampleCount] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/timings-measured.json >> bench/results/report.md
          printf '\n## Module Transforms\n\nOrdered source compilation, rewriting, and maps. Final minification and browser bundling are outside timing; sizes include the bundled callable runtime. Local themes include literal token extraction, resolution, and two scalar scopes.\n' >> bench/results/report.md
          for kind in literal theme alias tokens; do
            case "$kind" in
              literal) title='Literal Styles'; group='module transform' ;;
              theme) title='Local Theme Styles'; group='theme source transform' ;;
              alias) title='Theme Aliases'; group='theme alias transform' ;;
              tokens) title='Explicit Theme Tokens'; group='theme token transform' ;;
            esac
            printf '\n### %s\n\n| Styles | Time (ms) | CSS gzip | JS gzip | Total gzip |\n| --- | ---: | ---: | ---: | ---: |\n' "$title" >> bench/results/report.md
            jq -rs --arg kind "$kind" --arg group "$group" --slurpfile timings bench/results/timings-measured.json '
              sort_by(.count)[] | select(.kind == $kind) | . as $size |
              $timings[0].files[].groups[] | select(.fullName | endswith($group + " / " + ($size.count | tostring) + " styles")) |
              .benchmarks[] |
              [$size.count, ((.mean * 1000 | round) / 1000), $size.css.gzip, $size.javascript.gzip, $size.total.gzip] |
              "| " + (map(tostring) | join(" | ")) + " |"
            ' bench/results/transform/*.json >> bench/results/report.md
          done
          printf '\n## Static Props Binding\n\n| Application | Time (ns) | Error (±%%) | Samples |\n| --- | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r '
            .files[].groups[] | select(.fullName | contains("static props binding")) | .benchmarks[] |
            [.name, (.mean * 1000000 | round), ((.rme * 100 | round) / 100), .sampleCount] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/timings-measured.json >> bench/results/report.md
          printf '\n## File Host — 100 Styles\n\nCold process includes startup; watch edits include the source write through artifact publication.\n\n| Operation | Time (ms) | Error (±%%) | Samples |\n| --- | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r '
            .files[].groups[] | select(.fullName | contains("file host / ")) | .benchmarks[] |
            [.name, ((.mean * 1000 | round) / 1000), ((.rme * 100 | round) / 100), .sampleCount] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/timings-measured.json >> bench/results/report.md
          printf '\n## Theme Compilation\n\nIn-memory emission with two scopes and light/dark pairs; no source rewriting or client bundling. Sizes are emitted CSS before final minification.\n\n| Styles | Time (ms) | CSS raw | CSS gzip | CSS Brotli |\n| --- | ---: | ---: | ---: | ---: |\n' >> bench/results/report.md
          jq -r --slurpfile timings bench/results/timings-measured.json '
            . as $size |
            $timings[0].files[].groups[] | select(.fullName | endswith("theme compilation / " + ($size.count | tostring) + " styles")) |
            .benchmarks[] |
            [$size.count, ((.mean * 1000 | round) / 1000), $size.raw, $size.gzip, $size.brotli] |
            "| " + (map(tostring) | join(" | ")) + " |"
          ' bench/results/themes/*.json >> bench/results/report.md
          printf '\nBuild timings use warm host processes and fresh compiler state. Compiler workflows have different scopes; see bench/README.md in the repository for measurement boundaries.\n' >> bench/results/report.md
      - name: Check framework performance
        id: frameworks
        continue-on-error: true
        run: node bench/Check.ts bench/results > bench/results/frameworks.md
      - name: Check runtime framework performance
        id: runtime
        continue-on-error: true
        run: node bench/RuntimeReport.ts bench/results > bench/results/runtime.md
      - name: Prepare benchmark comparisons
        id: comparison
        env:
          BENCH_BASELINE_MODE: same-runner
          BASELINE_DIRECTORY: ${{ steps.baseline.outcome == 'success' && format('{0}/benchmark-baseline', runner.temp) || '' }}
        run: |
          node bench/Compare.ts bench/results "$BASELINE_DIRECTORY" "$RUNNER_TEMP/benchmark-action" > "$RUNNER_TEMP/benchmark-comparison.md"
          printf '# Benchmark Report\n\n[Workflow run](%s/%s/actions/runs/%s)\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/benchmark-report.md"
          cat bench/results/frameworks.md bench/results/runtime.md "$RUNNER_TEMP/benchmark-comparison.md" bench/results/report.md >> "$RUNNER_TEMP/benchmark-report.md"
          mv "$RUNNER_TEMP/benchmark-report.md" bench/results/report.md
          cat bench/results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment benchmark results
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmarks
          path: bench/results/report.md
      - if: ${{ !cancelled() }}
        name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: benchmarks
          path: bench/results/
          retention-days: 30
      - name: Upload baseline results
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: benchmarks-baseline
          path: ${{ runner.temp }}/benchmark-baseline/
          retention-days: 30
      - name: Report timing comparisons
        if: ${{ !cancelled() && steps.comparison.outcome == 'success' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          alert-threshold: '${{ env.BENCH_TIME_THRESHOLD }}%'
          external-data-json-path: ${{ runner.temp }}/benchmark-action/time-baseline.json
          fail-on-alert: false
          github-token: ${{ github.token }}
          name: time
          output-file-path: ${{ runner.temp }}/benchmark-action/time.json
          save-data-file: false
          tool: customSmallerIsBetter
      - name: Check size regressions
        if: ${{ !cancelled() && steps.comparison.outcome == 'success' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          alert-threshold: '${{ env.BENCH_SIZE_THRESHOLD }}%'
          external-data-json-path: ${{ runner.temp }}/benchmark-action/size-baseline.json
          fail-on-alert: ${{ github.event_name != 'push' }}
          github-token: ${{ github.token }}
          name: size
          output-file-path: ${{ runner.temp }}/benchmark-action/size.json
          save-data-file: false
          tool: customSmallerIsBetter
      - name: Enforce framework performance
        if: ${{ !cancelled() && (steps.frameworks.outcome == 'failure' || steps.runtime.outcome == 'failure') }}
        run: exit 1
    timeout-minutes: 30
permissions:
  contents: read
