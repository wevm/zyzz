name: Binding
on:
  pull_request:
    paths:
      - .cargo/**
      - .github/workflows/binding.yml
      - Cargo.lock
      - Cargo.toml
      - crates/binding/**
      - rust-toolchain.toml
      - scripts/build-binding.ts
      - scripts/check-binding.ts
      - scripts/train-binding.ts
  workflow_call:
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: ${{ !endsWith(matrix.target, '-musl') }}
        name: Set up pnpm
        uses: wevm/actions/vendor/pnpm/action-setup/viem-wagmi@8963daf30237417f873c8e2f17e3bf9415e3a7b9
      - if: ${{ !endsWith(matrix.target, '-musl') }}
        name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          node-version: '24'
      # The build needs only the root package's tooling, so examples and the site stay
      # uninstalled on hosts their dependencies do not support.
      - if: ${{ !endsWith(matrix.target, '-musl') }}
        name: Install dependencies
        run: pnpm install --frozen-lockfile --filter zyzz
      - if: ${{ !endsWith(matrix.target, '-musl') }}
        name: Cache Rust builds
        uses: wevm/actions/vendor/Swatinem/rust-cache/v2.9.2@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ !endsWith(matrix.target, '-musl') }}
        name: Build native addon
        run: node scripts/build-binding.ts --target ${{ matrix.target }}
      - if: ${{ !endsWith(matrix.target, '-musl') }}
        name: Load native addon
        run: node scripts/check-binding.ts --target ${{ matrix.target }}
      # Debian 11 ships glibc 2.31, older than the runner's, so a symbol from a newer glibc fails
      # to load here.
      - if: ${{ endsWith(matrix.target, '-linux-gnu') }}
        name: Load native addon on Debian 11
        run: docker run --rm -v "$PWD:/zyzz" -w /zyzz node:22-bullseye-slim node scripts/check-binding.ts --target ${{ matrix.target }}
      # Training runs the instrumented addon, so musl builds install and run inside Alpine.
      - if: ${{ endsWith(matrix.target, '-musl') }}
        name: Build and load native addon on Alpine
        run: |
          docker run --rm -e CI -v "$PWD:/zyzz" -w /zyzz node:24-alpine sh -euc '
            apk add --no-cache build-base rustup
            rustup-init -y --default-toolchain none --profile minimal
            . "$HOME/.cargo/env"
            corepack enable
            pnpm install --frozen-lockfile --filter zyzz
            node scripts/build-binding.ts --target ${{ matrix.target }}
            node scripts/check-binding.ts --target ${{ matrix.target }}
          '
      - name: Upload native addon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: binding-${{ matrix.target }}
          path: binding/*.node
          retention-days: 1
    timeout-minutes: 60

permissions:
  contents: read
