name: Verify
on:
  workflow_call:
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build package
        run: pnpm build
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Check code
        run: pnpm check
      - name: Check at-rule inventory
        run: pnpm check:at-rules >> "$GITHUB_STEP_SUMMARY"
      - name: Check CSS coverage
        run: pnpm check:css >> "$GITHUB_STEP_SUMMARY"
      - env:
          NODE_OPTIONS: --max-old-space-size=4096
        name: Check types
        run: pnpm check:types
  conformance:
    name: CSS Property Conformance (100%)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Enforce complete property conformance
        run: |
          set -o pipefail
          pnpm check:css:full 2>&1 | tee css-conformance.md
      - if: ${{ always() }}
        name: Publish conformance summary
        run: cat css-conformance.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ always() && hashFiles('css-conformance.md') != '' }}
        name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: css-conformance
          path: css-conformance.md
          retention-days: 30
  test:
    name: Test
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: test/conformance/requirements.txt
          python-version: '3.12'
      - name: Install print engine
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
          python -m pip install -r test/conformance/requirements.txt
      - env:
          CI: true
        name: Run tests
        run: pnpm run test run --coverage --reporter=default --reporter=json --outputFile=test-results/integration.json
      - name: Enforce full at-rule compiler acceptance
        run: node scripts/at-rule-acceptance.ts --require-full --results test-results/integration.json
      - if: ${{ !cancelled() && hashFiles('test-results/at-rule-print-capabilities.json') != '' }}
        name: Upload print capabilities
        uses: actions/upload-artifact@v4
        with:
          name: at-rule-print-capabilities
          path: test-results/at-rule-print-capabilities.json
          retention-days: 30
      - if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          comment-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'pr' || 'none' }}
          file-coverage-mode: all
          name: Integration Tests
      - if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 30
      - if: ${{ !cancelled() && hashFiles('test-results/css-browser-capabilities.json') != '' }}
        name: Upload CSS browser capabilities
        uses: actions/upload-artifact@v4
        with:
          name: css-browser-capabilities
          path: test-results/css-browser-capabilities.json
          retention-days: 30
      - if: ${{ failure() && hashFiles('test-results/css-consumer.test-d.ts') != '' }}
        name: Upload failing CSS consumer
        uses: actions/upload-artifact@v4
        with:
          name: css-consumer
          path: test-results/css-consumer.test-d.ts
          retention-days: 30
      - if: ${{ !cancelled() && hashFiles('test-results/at-rule-browser-capabilities.json') != '' }}
        name: Upload at-rule browser capabilities
        uses: actions/upload-artifact@v4
        with:
          name: at-rule-browser-capabilities
          path: test-results/at-rule-browser-capabilities.json
          retention-days: 30
  typescript:
    name: TypeScript ${{ matrix.typescript }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install TypeScript ${{ matrix.typescript }}
        run: |
          pnpm add --save-dev "${{ matrix.package }}@${{ matrix.typescript }}"
          ${{ matrix.tsc }} --version
      - name: Check types
        run: |
          set -o pipefail
          ${{ matrix.tsc }} --extendedDiagnostics | tee typescript-diagnostics.txt
          {
            printf '## TypeScript %s type check\n\n```\n' "$(${{ matrix.tsc }} --version | sed 's/^Version //')"
            cat typescript-diagnostics.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ matrix.compiler == 'javascript' }}
        name: Check type instantiations
        run: |
          set -o pipefail
          pnpm bench:types | tee type-benches.txt
          {
            printf '## TypeScript %s type instantiations\n\n<details>\n<summary>Attest benches</summary>\n\n```\n' "${{ matrix.typescript }}"
            cat type-benches.txt
            printf '```\n\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ matrix.compiler == 'native' }}
        name: Report skipped type instantiation benches
        run: |
          printf '## TypeScript %s type instantiations\n\nAttest instantiation benches require the JavaScript compiler API, which the native TypeScript package does not ship. Whole-program instantiation counts appear in the type check diagnostics above.\n' "${{ matrix.typescript }}" >> "$GITHUB_STEP_SUMMARY"
    strategy:
      fail-fast: false
      # JavaScript releases replace the pinned typescript package so attest and
      # the repository scripts import the version under test. The native
      # compiler ships no compiler API, so it installs beside the pinned
      # package under an alias and only its tsc binary runs.
      matrix:
        include:
          - compiler: javascript
            package: typescript
            tsc: pnpm exec tsc
            typescript: '5.9'
          - compiler: javascript
            package: typescript
            tsc: pnpm exec tsc
            typescript: '6.0'
          - compiler: native
            package: typescript-native@npm:typescript
            tsc: node node_modules/typescript-native/bin/tsc
            typescript: '7.0'
    timeout-minutes: 45
