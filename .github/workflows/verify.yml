name: Verify
on:
  workflow_call:
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build package
        run: pnpm build
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Check code
        run: pnpm check
      - name: Check types
        run: pnpm check:types
  host-macos:
    name: Host on macOS
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Verify case-insensitive output ownership
        run: pnpm exec vp test run src/node/Host.test.ts -t 'prefixed sources and case-only renames'
    timeout-minutes: 5
  test:
    name: Test
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - env:
          CI: true
        name: Run tests
        run: pnpm run test run --coverage
      - if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          comment-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'pr' || 'none' }}
          file-coverage-mode: all
          name: Integration Tests
      - if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 30
