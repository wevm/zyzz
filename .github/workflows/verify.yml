name: Verify
on:
  workflow_call:
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build package
        run: pnpm build
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Check code
        run: pnpm check
      - name: Check types
        run: pnpm check:types
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - env:
          CI: true
        name: Run tests
        run: pnpm run test run --bail=1
