name: Verify
on:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build package
        run: pnpm build
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Check code
        run: pnpm check
      - name: Check at-rule inventory
        run: pnpm check:at-rules >> "$GITHUB_STEP_SUMMARY"
  conformance:
    name: CSS Property Conformance (100%)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Enforce complete property conformance
        run: |
          set -o pipefail
          pnpm check:css:full 2>&1 | tee css-conformance.md
      - if: ${{ always() }}
        name: Publish conformance summary
        run: cat css-conformance.md >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ always() && hashFiles('css-conformance.md') != '' }}
        name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: css-conformance
          path: css-conformance.md
          retention-days: 30
  test-shards:
    name: Test (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: test/conformance/requirements.txt
          python-version: '3.12'
      - name: Install print engine
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
          python -m pip install -r test/conformance/requirements.txt
      - name: Build package for integration consumers
        run: pnpm build
      - env:
          CI: true
        name: Run tests
        run: pnpm run test run --shard=${{ matrix.shard }}/3 --coverage --reporter=default --reporter=blob --outputFile.blob=test-results/blob-${{ matrix.shard }}.json
      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: test-shard-${{ matrix.shard }}
          path: |
            test-results/
            coverage/
            bench/results/next-*.json
          retention-days: 1
    timeout-minutes: 30
  test:
    name: Test
    if: ${{ !cancelled() }}
    needs: [test-shards, typescript, type-benches]
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: test-shard-*
          merge-multiple: true
      - name: Require all shards and type checks
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
          TYPES_RESULT: ${{ needs.typescript.result }}
          TYPE_BENCHES_RESULT: ${{ needs.type-benches.result }}
        run: |
          test "$SHARDS_RESULT" = success
          test "$TYPES_RESULT" = success
          test "$TYPE_BENCHES_RESULT" = success
          for shard in 1 2 3; do test -f "test-results/blob-$shard.json"; done
      - name: Merge test results and coverage
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results/blobs
          mv test-results/blob-*.json test-results/blobs/
          pnpm run test run --merge-reports=test-results/blobs --coverage --reporter=default --reporter=json --outputFile=test-results/integration.json
      - env:
          NODE_OPTIONS: --max-old-space-size=4096
        name: Enforce full at-rule compiler acceptance
        run: node scripts/at-rule-acceptance.ts --require-full --require-targets --results test-results/integration.json
      - if: ${{ !cancelled() && hashFiles('test-results/at-rule-target-retention.json') != '' }}
        name: Upload at-rule target review
        uses: actions/upload-artifact@v4
        with:
          name: at-rule-target-retention
          path: test-results/at-rule-target-retention.json
          retention-days: 30
      - if: ${{ !cancelled() && hashFiles('test-results/at-rule-print-capabilities.json') != '' }}
        name: Upload print capabilities
        uses: actions/upload-artifact@v4
        with:
          name: at-rule-print-capabilities
          path: test-results/at-rule-print-capabilities.json
          retention-days: 30
      - if: ${{ failure() && hashFiles('test-results/next-*.json') != '' }}
        name: Upload Next.js failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: next-failure-evidence
          path: test-results/next-*.json
          retention-days: 30
      - if: ${{ !cancelled() && hashFiles('bench/results/next-*.json') != '' }}
        name: Upload Next.js build comparisons
        uses: actions/upload-artifact@v4
        with:
          name: next-build-comparisons
          path: bench/results/next-*.json
          retention-days: 30
      - if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          comment-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'pr' || 'none' }}
          file-coverage-mode: all
          name: Integration Tests
      - if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 30
      - if: ${{ !cancelled() && hashFiles('test-results/css-browser-capabilities.json') != '' }}
        name: Upload CSS browser capabilities
        uses: actions/upload-artifact@v4
        with:
          name: css-browser-capabilities
          path: test-results/css-browser-capabilities.json
          retention-days: 30
      - if: ${{ failure() && hashFiles('test-results/css-consumer.test-d.ts') != '' }}
        name: Upload failing CSS consumer
        uses: actions/upload-artifact@v4
        with:
          name: css-consumer
          path: test-results/css-consumer.test-d.ts
          retention-days: 30
      - if: ${{ !cancelled() && hashFiles('test-results/at-rule-browser-capabilities.json') != '' }}
        name: Upload at-rule browser capabilities
        uses: actions/upload-artifact@v4
        with:
          name: at-rule-browser-capabilities
          path: test-results/at-rule-browser-capabilities.json
          retention-days: 30
  typescript:
    name: TypeScript ${{ matrix.typescript }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install TypeScript ${{ matrix.typescript }}
        run: |
          pnpm add --save-dev "${{ matrix.package }}@${{ matrix.typescript }}"
          ${{ matrix.tsc }} --version
      - name: Check types
        run: |
          set -o pipefail
          ${{ matrix.tsc }} --extendedDiagnostics | tee typescript-diagnostics.txt
          {
            printf '## TypeScript %s type check\n\n```\n' "$(${{ matrix.tsc }} --version | sed 's/^Version //')"
            cat typescript-diagnostics.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
    strategy:
      fail-fast: false
      # JavaScript releases replace the pinned typescript package so attest and
      # the repository scripts import the version under test. The native
      # compiler ships no compiler API, so it installs beside the pinned
      # package under an alias and only its tsc binary runs.
      matrix:
        include:
          - compiler: javascript
            package: typescript
            tsc: pnpm exec tsc
            typescript: '5.9'
          - compiler: javascript
            package: typescript
            tsc: pnpm exec tsc
            typescript: '6.0'
          - compiler: native
            package: typescript-native@npm:typescript
            tsc: node node_modules/typescript-native/bin/tsc
            typescript: '7.0'
    timeout-minutes: 45
  type-benches:
    name: Type instantiations ${{ matrix.typescript }} (${{ matrix.shard }}/2)
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        typescript: ['5.9', '6.0']
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install TypeScript ${{ matrix.typescript }}
        run: pnpm add --save-dev "typescript@${{ matrix.typescript }}"
      - name: Check type instantiations
        run: |
          set -o pipefail
          pnpm bench:types --shard ${{ matrix.shard }}/2 | tee type-benches.txt
          cat type-benches.txt >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 30
