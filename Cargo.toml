[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/wevm/zyzz"
rust-version = "1.97.0"
version = "0.0.0"

[workspace.dependencies]
compact_str = "0.9"
indexmap = "2"
insta = "1"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["visitor"] }
memchr = "2"
mimalloc = "0.1"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-build = "2"
napi-derive = "3"
oxc_allocator = "=0.148.0"
oxc_ast = "=0.148.0"
oxc_ast_visit = "=0.148.0"
oxc_diagnostics = "=0.148.0"
oxc_ecmascript = "=0.148.0"
oxc_index = { version = "=5.0.0", features = ["nonmax"] }
oxc_parser = "=0.148.0"
oxc_semantic = "=0.148.0"
oxc_span = "=0.148.0"
oxc_syntax = { version = "=0.148.0", features = ["to_js_string"] }
parcel_selectors = "=0.28.3"
parcel_sourcemap = { version = "=2.1.1", features = ["json"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = { version = "1", features = ["const_generics", "union"] }
zyzz_compiler = { path = "crates/zyzz_compiler" }
zyzz_css_syntax = { path = "crates/zyzz_css_syntax" }

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
missing_docs = "warn"
non_ascii_idents = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
# FxHash is the only hasher, since clippy.toml disallows the std map types.
implicit_hasher = "allow"
iter_over_hash_type = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
similar_names = "allow"
todo = "warn"
too_many_lines = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
# The binding converts panics into compiler errors, so a development server never aborts.
panic = "unwind"
strip = "symbols"

[profile.profiling]
debug = "full"
inherits = "release"
strip = false
