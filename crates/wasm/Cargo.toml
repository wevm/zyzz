[package]
name = "wasm"
description = "WebAssembly entrypoint that exposes the Zyzz compiler to hosts without the native addon."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# The documentation playground loads source compilation separately from the small CSS engine.
compiler = ["compiler/compiler"]

[dependencies]
# Default browser builds emit web CSS only, without the source parsers.
compiler = { path = "../compiler", default-features = false }

[lints]
workspace = true
