[package]
name = "wasm"
description = "WebAssembly entrypoint that exposes the Zyzz compiler to hosts without the native addon."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# Browsers compile web CSS only, so the parser-backed compiler stays out of the module.
compiler = { path = "../compiler", default-features = false }

[lints]
workspace = true
