[package]
name = "zyzz_compiler"
description = "Pure, deterministic Zyzz source extraction, CSS emission, and module rewriting."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["compiler"]
# Source extraction, module rewriting, and React Native emission. Web CSS emission and the wire
# format need none of these parsers, so browser builds disable the feature.
compiler = [
  "dep:lightningcss",
  "dep:oxc_allocator",
  "dep:oxc_ast",
  "dep:oxc_ast_visit",
  "dep:oxc_diagnostics",
  "dep:oxc_ecmascript",
  "dep:oxc_index",
  "dep:oxc_parser",
  "dep:oxc_semantic",
  "dep:zyzz_css_syntax",
]

[dependencies]
compact_str = { workspace = true }
indexmap = { workspace = true }
lightningcss = { workspace = true, optional = true }
memchr = { workspace = true }
oxc_allocator = { workspace = true, optional = true }
oxc_ast = { workspace = true, optional = true }
oxc_ast_visit = { workspace = true, optional = true }
oxc_diagnostics = { workspace = true, optional = true }
oxc_ecmascript = { workspace = true, optional = true }
oxc_index = { workspace = true, optional = true }
oxc_parser = { workspace = true, optional = true }
oxc_semantic = { workspace = true, optional = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
rustc-hash = { workspace = true }
# Arc deserialization keeps wire strings shared; float_roundtrip parses numbers exactly.
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
smallvec = { workspace = true }
zyzz_css_syntax = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }

