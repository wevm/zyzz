[package]
name = "zyzz_compiler"
description = "Pure, deterministic Zyzz source extraction, CSS emission, and module rewriting."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
compact_str = { workspace = true }
indexmap = { workspace = true }
lightningcss = { workspace = true, features = ["sourcemap"] }
memchr = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_diagnostics = { workspace = true }
oxc_ecmascript = { workspace = true }
oxc_index = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
parcel_selectors = { workspace = true }
parcel_sourcemap = { workspace = true }
rustc-hash = { workspace = true }
# Arc deserialization keeps wire strings shared; float_roundtrip parses numbers exactly.
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
smallvec = { workspace = true }
zyzz_css_syntax = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
