    '@babel/core': '^7.29.7'
    'next': '^16.3.5'
    'react': '^19.0.0'
    'vite': '^8.0.0'

overrides:
  '@sveltejs/vite-plugin-svelte': 'catalog:'
  '@tanstack/react-router': 'catalog:'
  '@tanstack/react-start': 'catalog:'
  '@types/node': 'catalog:'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
