  'solid-js': 'catalog:'
  'svelte': 'catalog:'
  'vite': 'catalog:'
  'vite-plugin-solid': 'catalog:'
  'zyzz': 'workspace:*'

# These tools still require the JavaScript compiler API.
packageExtensions:
  '@ark/attest':
    dependencies:
      typescript: *typescriptApi
  ts-evaluator:
    dependencies:
      typescript: *typescriptApi
  zile:
    dependencies:
      typescript: *typescriptApi

patchedDependencies:
  zile@0.0.30: patches/zile@0.0.30.patch

pnpmfile: .pnpmfile.ts
